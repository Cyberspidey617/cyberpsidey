name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:      # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF4FD8&color_dots=#EDE9FE,#C4B5FD,#8B5CF6,#6D28D9,#00F0FF
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF4FD8&color_dots=#1A0F3D,#3B2A7A,#8B5CF6,#C084FC,#00F0FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
